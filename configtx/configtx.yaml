Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ../organizations/ordererOrganizations/esign.com/msp
    Policies:
      Readers:
        Type: ImplicitMeta
        Rule: "ANY Readers"
      Writers:
        Type: ImplicitMeta
        Rule: "ANY Writers"
      Admins:
        Type: ImplicitMeta
        Rule: "MAJORITY Admins"

  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: ../organizations/peerOrganizations/org1.esign.com/msp
    Policies:
      Readers:
        Type: ImplicitMeta
        Rule: "ANY Readers"
      Writers:
        Type: ImplicitMeta
        Rule: "ANY Writers"
      Admins:
        Type: ImplicitMeta
        Rule: "MAJORITY Admins"
      Endorsement:
        Type: ImplicitMeta
        Rule: "MAJORITY Endorsement"
    AnchorPeers:
      - Host: peer0.org1.esign.com
        Port: 7051
      - Host: peer1.org1.esign.com
        Port: 8051

  - &Org2
    Name: Org2MSP
    ID: Org2MSP
    MSPDir: ../organizations/peerOrganizations/org2.esign.com/msp
    Policies:
      Readers:
        Type: ImplicitMeta
        Rule: "ANY Readers"
      Writers:
        Type: ImplicitMeta
        Rule: "ANY Writers"
      Admins:
        Type: ImplicitMeta
        Rule: "MAJORITY Admins"
      Endorsement:
        Type: ImplicitMeta
        Rule: "MAJORITY Endorsement"
    AnchorPeers:
      - Host: peer0.org2.esign.com
        Port: 9051
      - Host: peer1.org2.esign.com
        Port: 10051

Orderer: &Orderer
  OrdererType: etcdraft
  Addresses:
    - orderer.esign.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.esign.com
        Port: 7050
        ClientTLSCert: ../organizations/ordererOrganizations/esign.com/orderers/orderer.esign.com/tls/ca.crt
        ServerTLSCert: ../organizations/ordererOrganizations/esign.com/orderers/orderer.esign.com/tls/server.crt
  Organizations:
    - *OrdererOrg
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    V2_0: true

Channel: &Channel
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    V2_0: true

Application: &Application
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    V2_0: true

Profiles:
  TwoOrgsOrdererGenesis:
    <<: *Channel
    Orderer:
      <<: *Orderer
    Consortiums:
      SampleConsortium:
        Organizations:
          - *Org1
          - *Org2

  TwoOrgsChannel:
    <<: *Channel
    Consortium: SampleConsortium
    Application:
      <<: *Application
      Organizations:
        - *Org1
        - *Org2

  ChannelUsingRaft:
    <<: *Channel
    Orderer:
      <<: *Orderer
    Consortium: SampleConsortium
    Application:
      <<: *Application
      Organizations:
        - *Org1
        - *Org2
