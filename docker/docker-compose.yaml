networks:
  fabric_esign:
    external: true

services:

  orderer.esign.com:
    container_name: orderer.esign.com
    hostname: orderer.esign.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=/var/hyperledger/orderer/tls/ca.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=/var/hyperledger/orderer/tls/ca.crt
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=/var/hyperledger/orderer/tls/ca.crt
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    volumes:
      - ../organizations/ordererOrganizations/esign.com/orderers/orderer.esign.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/esign.com/orderers/orderer.esign.com/tls:/var/hyperledger/orderer/tls
      - ordererdata:/var/hyperledger/production/orderer
    networks:
      - fabric_esign
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:7053/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  couchdb0:
    container_name: couchdb.peer0.org1
    image: couchdb:3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fabric_esign

  peer0.org1.esign.com:
    container_name: peer0.org1.esign.com
    hostname: peer0.org1.esign.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.org1.esign.com
      - CORE_PEER_ADDRESS=peer0.org1.esign.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.esign.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_esign
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.peer0.org1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_STATE_COUCHDBCONFIG_CACHESIZE=0
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock  #debian ubuntu
      # - CORE_VM_ENDPOINT=unix:///var/run/docker.sock  #fedora
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=false
      - CORE_PEER_TLS_CLIENTROOTCAS_FILES=/etc/hyperledger/fabric/tls/ca.crt,/etc/hyperledger/fabric/tls-ca-esign.pem
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.esign.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.org1.esign.com:8051
      - FABRIC_LOGGING_SPEC=INFO

    volumes:
      - ./core-peer0.org1.yaml:/etc/hyperledger/fabric/core.yaml
      - ../organizations/peerOrganizations/org1.esign.com/peers/peer0.org1.esign.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org1.esign.com/peers/peer0.org1.esign.com/tls:/etc/hyperledger/fabric/tls
      - peer0org1:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock  #debian ubuntu
      # - /var/run/docker.sock:/var/run/docker.sock:z  #fedora
      - ../organizations/peerOrganizations/org1.esign.com/msp/tlscacerts/tlsca-esign.pem:/etc/hyperledger/fabric/tls-ca-esign.pem:ro
    depends_on:
      couchdb0:
        condition: service_healthy
    networks:
      - fabric_esign
    healthcheck:
      test: ["CMD", "peer", "node", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  couchdb1:
    container_name: couchdb.peer1.org1
    image: couchdb:3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fabric_esign

  peer1.org1.esign.com:
    container_name: peer1.org1.esign.com
    hostname: peer1.org1.esign.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer1.org1.esign.com
      - CORE_PEER_ADDRESS=peer1.org1.esign.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer1.org1.esign.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_esign
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.peer1.org1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_STATE_COUCHDBCONFIG_CACHESIZE=0
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock  #debian ubuntu
      # - CORE_VM_ENDPOINT=unix:///var/run/docker.sock  #fedora
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=false
      - CORE_PEER_TLS_CLIENTROOTCAS_FILES=/etc/hyperledger/fabric/tls/ca.crt,/etc/hyperledger/fabric/tls-ca-esign.pem
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org1.esign.com:8051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.esign.com:7051
      - FABRIC_LOGGING_SPEC=INFO

    volumes:
      - ./core-peer1.org1.yaml:/etc/hyperledger/fabric/core.yaml
      - ../organizations/peerOrganizations/org1.esign.com/peers/peer1.org1.esign.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org1.esign.com/peers/peer1.org1.esign.com/tls:/etc/hyperledger/fabric/tls
      - peer1org1:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock  #debian ubuntu
      # - /var/run/docker.sock:/var/run/docker.sock:z  #fedora
      - ../organizations/peerOrganizations/org1.esign.com/msp/tlscacerts/tlsca-esign.pem:/etc/hyperledger/fabric/tls-ca-esign.pem:ro
    depends_on:
      couchdb1:
        condition: service_healthy
    networks:
      - fabric_esign
    healthcheck:
      test: ["CMD", "peer", "node", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  couchdb2:
    container_name: couchdb.peer0.org2
    image: couchdb:3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fabric_esign

  peer0.org2.esign.com:
    container_name: peer0.org2.esign.com
    hostname: peer0.org2.esign.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.org2.esign.com
      - CORE_PEER_ADDRESS=peer0.org2.esign.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.esign.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_esign
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.peer0.org2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_STATE_COUCHDBCONFIG_CACHESIZE=0
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock  #debian ubuntu
      # - CORE_VM_ENDPOINT=unix:///var/run/docker.sock  #fedora
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=false
      - CORE_PEER_TLS_CLIENTROOTCAS_FILES=/etc/hyperledger/fabric/tls/ca.crt,/etc/hyperledger/fabric/tls-ca-esign.pem
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.esign.com:9051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.org2.esign.com:10051
      - FABRIC_LOGGING_SPEC=INFO

    volumes:
      - ./core-peer0.org2.yaml:/etc/hyperledger/fabric/core.yaml
      - ../organizations/peerOrganizations/org2.esign.com/peers/peer0.org2.esign.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org2.esign.com/peers/peer0.org2.esign.com/tls:/etc/hyperledger/fabric/tls
      - peer0org2:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock  #debian ubuntu
      # - /var/run/docker.sock:/var/run/docker.sock:z  #fedora
      - ../organizations/peerOrganizations/org2.esign.com/msp/tlscacerts/tlsca-esign.pem:/etc/hyperledger/fabric/tls-ca-esign.pem:ro
    depends_on:
      couchdb2:
        condition: service_healthy
    networks:
      - fabric_esign
    healthcheck:
      test: ["CMD", "peer", "node", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  couchdb3:
    container_name: couchdb.peer1.org2
    image: couchdb:3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "8984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fabric_esign

  peer1.org2.esign.com:
    container_name: peer1.org2.esign.com
    hostname: peer1.org2.esign.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer1.org2.esign.com
      - CORE_PEER_ADDRESS=peer1.org2.esign.com:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer1.org2.esign.com:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_esign
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.peer1.org2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_STATE_COUCHDBCONFIG_CACHESIZE=0
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock  #debian ubuntu
      # - CORE_VM_ENDPOINT=unix:///var/run/docker.sock  #fedora
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=false
      - CORE_PEER_TLS_CLIENTROOTCAS_FILES=/etc/hyperledger/fabric/tls/ca.crt,/etc/hyperledger/fabric/tls-ca-esign.pem
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org2.esign.com:10051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.esign.com:9051
      - FABRIC_LOGGING_SPEC=INFO

    volumes:
      - ./core-peer1.org2.yaml:/etc/hyperledger/fabric/core.yaml
      - ../organizations/peerOrganizations/org2.esign.com/peers/peer1.org2.esign.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org2.esign.com/peers/peer1.org2.esign.com/tls:/etc/hyperledger/fabric/tls
      - peer1org2:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock  #debian ubuntu
      # - /var/run/docker.sock:/var/run/docker.sock:z  #fedora
      - ../organizations/peerOrganizations/org2.esign.com/msp/tlscacerts/tlsca-esign.pem:/etc/hyperledger/fabric/tls-ca-esign.pem:ro
    depends_on:
      couchdb3:
        condition: service_healthy
    networks:
      - fabric_esign
    healthcheck:
      test: ["CMD", "peer", "node", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nats-org1:
    container_name: nats.org1.esign.com
    hostname: nats.org1.esign.com
    image: nats:2.10-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "--cluster_name=esign_cluster"
      - "--http_port=8222"
    volumes:
      - nats_org1_data:/data
    networks:
      - fabric_esign
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats-org2:
    container_name: nats.org2.esign.com
    hostname: nats.org2.esign.com
    image: nats:2.10-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "--cluster_name=esign_cluster"
      - "--http_port=8223"
    volumes:
      - nats_org2_data:/data
    networks:
      - fabric_esign
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8223/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - SYS_CHANNEL=e-sign-sys-channel
      - FABRIC_CFG_PATH=/workspace
      - GOPATH=/opt/gopath
      # - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock  #debian ubuntu
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock  #fedora
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.esign.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/workspace/organizations/peerOrganizations/org1.esign.com/peers/peer0.org1.esign.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/workspace/organizations/peerOrganizations/org1.esign.com/peers/peer0.org1.esign.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/workspace/organizations/peerOrganizations/org1.esign.com/peers/peer0.org1.esign.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/workspace/organizations/peerOrganizations/org1.esign.com/users/Admin@org1.esign.com/msp
    working_dir: /workspace
    command: /bin/bash
    volumes:
      # - /var/run/:/host/var/run/  #debian ubuntu
      - /var/run/docker.sock:/var/run/docker.sock:z  #fedora
      - ./../organizations:/workspace/organizations
      - ./../system-genesis-block:/workspace/system-genesis-block
      - ./../scripts:/workspace/scripts
      - ./../docker:/workspace/docker
      - ./../configtx:/workspace/configtx
      - ./../chaincode-go:/workspace/chaincode-go
    depends_on:
      - peer0.org1.esign.com
      - peer1.org1.esign.com
      - peer0.org2.esign.com
      - peer1.org2.esign.com
    networks:
      - fabric_esign

volumes:
  ordererdata:
  peer0org1:
  peer1org1:
  peer0org2:
  peer1org2:
  nats_org1_data:
  nats_org2_data:
